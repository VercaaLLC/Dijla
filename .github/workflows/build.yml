name: Build and test Windows preview

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Check public source allowlist
        run: python tools/check_public_tree.py
      - name: Configure static x86 build
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A Win32 -T v142 -DCMAKE_SYSTEM_VERSION=10.0.19041.0
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Run synthetic storage and inventory tests
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Check executable dependencies
        run: python tools/verify_pe.py build/Release/Dijla.exe
      - name: Prepare unsigned preview with empty data
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path preview -ErrorAction Stop
          Copy-Item -LiteralPath build/Release/Dijla.exe -Destination preview/Dijla.exe
          & build/Release/DijlaTests.exe --create-empty preview/Dijla.data
          if ($LASTEXITCODE -ne 0) { throw 'Empty database creation failed' }
          if (@(Get-ChildItem -LiteralPath preview -File).Count -ne 2) { throw 'Expected exactly two files' }
      - name: Upload unsigned preview for review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Dijla-unsigned-preview
          path: |
            preview/Dijla.exe
            preview/Dijla.data
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
